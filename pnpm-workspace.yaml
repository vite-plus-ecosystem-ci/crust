packages:
  - apps/*
  - packages/*
  - scripts

catalog:
  # The docs examples type-check against @crustjs/effect, so both must resolve one copy.
  effect: 4.1.1
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.309b96aaf065d95452ca218076c666671cf36440
  vite-plus: 0.0.0-commit.309b96aaf065d95452ca218076c666671cf36440

overrides:
  # Vite plugins resolve the same Vite+ core that `vp build`/`vp test` run on.
  vite@*: "catalog:"

# Vite+ core has its own version, outside plugins' upstream `vite` peer ranges.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Dependency install scripts stay blocked; these platform binaries resolve through optionalDependencies.
allowBuilds:
  esbuild: false
  workerd: false
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  - "@tsrs/darwin-arm64@7.1.0-beta.tsrs2"
  - "@tsrs/darwin-x64@7.1.0-beta.tsrs2"
  - "@tsrs/linux-arm64-gnu@7.1.0-beta.tsrs2"
  - "@tsrs/linux-arm64-musl@7.1.0-beta.tsrs2"
  - "@tsrs/linux-x64-gnu@7.1.0-beta.tsrs2"
  - "@tsrs/linux-x64-musl@7.1.0-beta.tsrs2"
  - "@tsrs/win32-arm64@7.1.0-beta.tsrs2"
  - "@tsrs/win32-x64@7.1.0-beta.tsrs2"
  - tsrs@7.1.0-beta.tsrs2
