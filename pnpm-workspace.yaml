packages:
  - apps/*
  - packages/*
  - scripts

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  vite-plus: 0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1

overrides:
  # Vite plugins resolve the same Vite+ core that `vp build`/`vp test` run on.
  vite@*: "catalog:"

# Vite+ core has its own version, outside plugins' upstream `vite` peer ranges.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Dependency install scripts stay blocked; these platform binaries resolve through optionalDependencies.
allowBuilds:
  esbuild: false
  workerd: false
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - "@voidzero-dev/*"
  - "@oxc-project/*"
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - vitest
  - "@vitest/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
